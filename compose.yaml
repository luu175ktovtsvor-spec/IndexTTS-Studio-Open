name: indextts-studio

services:
  studio:
    build:
      context: .
    image: indextts-studio:local
    init: true
    restart: unless-stopped
    ports:
      - "${INDEXTTS_BIND_ADDRESS:-127.0.0.1}:${INDEXTTS_STUDIO_PORT:-7860}:7860"
    environment:
      INDEXTTS_AUTO_DOWNLOAD: "${INDEXTTS_AUTO_DOWNLOAD:-1}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_ENDPOINT: "${HF_ENDPOINT:-https://huggingface.co}"
    volumes:
      - checkpoints:/app/checkpoints
      - outputs:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:7860/api/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 2h
    stop_grace_period: 20s

volumes:
  checkpoints:
  outputs:
